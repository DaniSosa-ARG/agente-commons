[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-commons"
version = "0.4.0"
description = "Infraestructura compartida para agentes WhatsApp"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "twilio>=9.0",
    "fastapi>=0.100",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agente_commons*"]
