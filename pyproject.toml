[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-commons"
version = "0.1.0"
description = "Infraestructura compartida para agentes WhatsApp"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "twilio>=9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agente_commons*"]
